  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#0b1b2b;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #e6edf5}
  .topbar .name{font-weight:700;font-size:17px;letter-spacing:.02em}
  .btn{display:inline-block;background:#0D47A1;color:#fff;padding:14px 32px;border-radius:12px;font-weight:600;text-decoration:none;font-size:15px}
  .btn:hover{filter:brightness(1.12)}
  .topbar .btn{padding:10px 22px;font-size:14px}
  main{max-width:880px;margin:0 auto;padding:32px 16px 56px;text-align:center}
  .cv-img{display:block;margin:0 auto;width:100%;max-width:800px;height:auto;border-radius:16px;box-shadow:0 18px 50px rgba(6,25,28,.16);background:#fff}
  .actions{margin-top:24px}
</style>
<link rel="stylesheet" href="responsive.css?v=1"></head>
<body>
<header class="topbar">
  <span class="name">Ahmed Amer</span>
  <a class="btn" href="cv.png" download="Ahmed-Amer-CV.png">Download CV</a>
</header>
<main>
  <!-- CV image: to swap it, replace cv.png in the repo root. Do not crop or edit. -->
  <img loading="eager" decoding="async" class="cv-img" src="cv.png" alt="CV of Ahmed Amer, 4th Year Dental Student at Suez Canal University" width="2066" height="2924" fetchpriority="high" decoding="async">
  <div class="actions">
    <a class="btn" href="cv.png" download="Ahmed-Amer-CV.png">Download CV</a>
  </div>
</main>
</body>
</html>
