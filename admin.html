     2) Colors and fonts live in the :root CSS variables below.
     3) Each section is wrapped in  [ SECTION: name ]  comments.
        To remove a section, delete or comment out that block.
        To add a section, copy an existing block and rename it.
     4) No build tools needed. Open this file in any browser.
     ============================================================ -->

<style>
/* ================= EDIT: COLORS & FONTS ================= */
:root{
  --cream:      #F0F7FF;   /* page background (his --light-bg) */
  --cream-dark: #e2effc;   /* alt section background */
  --accent:     #1E90FF;   /* lighter blue - buttons & small headings */
  --deep:       #0A2A5E;   /* dark blue - intro background & dark elements */
  --ink:        #14212e;   /* main text */
  --ink-soft:   #51626f;   /* secondary text */
  --card:       #ffffff;   /* card background */
  --line:       #d7e3ef;   /* borders */
  --font-display: "Poppins", "Segoe UI", Arial, sans-serif;
  --font-body:    "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --radius: 26px;
  /* spacing scale (responsive spec) */
  --space-xs:8px; --space-sm:12px; --space-md:16px; --space-lg:24px; --space-xl:48px; --space-2xl:80px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;overflow-x:hidden}
body{
  overflow-x:hidden;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:clamp(15px,4vw,17px);
  line-height:1.65;
}
img{max-width:100%;height:auto;display:block}
a{text-decoration:none;color:inherit}
.wrap{max-width:100%;margin:0 auto;padding:0 var(--space-md)}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:-.02em}
.eyebrow{
  color:var(--accent);font-style:italic;font-family:Georgia,serif;
  font-size:18px;margin-bottom:8px;
}
.section{padding:var(--space-2xl) 0}
.section-title{
  font-size:clamp(22px,6vw,28px);font-weight:800;
  text-transform:uppercase;line-height:1.05;margin-bottom:14px;
}
.section-title .hl{color:var(--accent)}
.section-sub{color:var(--ink-soft);max-width:560px;margin-bottom:48px}

.intro{

}

  animation:bgZoom 3.4s cubic-bezier(.2,.6,.2,1) both;
}
@keyframes bgZoom{from{transform:scale(1.09)}to{transform:scale(1)}}
.intro .mark{
  position:relative;width:104px;height:104px;object-fit:contain;
  filter:drop-shadow(0 0 34px rgba(77,163,255,.45));
  animation:markGlow 1.1s cubic-bezier(.2,.7,.2,1) .2s both;
}
@keyframes markGlow{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.intro .who{
  position:relative;color:#fff;font-family:var(--font-display);font-weight:800;
  font-size:clamp(24px,4.6vw,34px);
  letter-spacing:.14em;text-transform:uppercase;animation:markIn 1s cubic-bezier(.2,.7,.2,1) .7s both;
  text-shadow:0 2px 22px rgba(6,25,28,.7);
}
.intro .who .hl{color:#4da3ff}
.intro .what{
  position:relative;color:#a9c8e8;font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  animation:markIn 1s ease 1.1s both;text-shadow:0 2px 16px rgba(6,25,28,.7);
}
.intro .intro-band{
  position:absolute;left:-30px;right:-30px;bottom:26px;background:var(--accent);
  transform:rotate(-1.5deg) translateY(140%);
  animation:bandUp .7s cubic-bezier(.2,.7,.2,1) 3.7s forwards;
  box-shadow:0 -6px 30px rgba(6,25,28,.35);
}
@keyframes bandUp{to{transform:rotate(-1.5deg) translateY(0)}}
.intro{will-change:transform}
@keyframes curtainUp{to{transform:translateY(-101%);visibility:hidden}}
@keyframes markIn{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
.hero .reveal{animation:heroIn .9s ease 5.6s both}
@keyframes heroIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

/* page appears only after the curtain opens */
body>*:not(.intro){animation:pageIn .85s ease 5.2s both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}

/* ---------- navbar ---------- */
.nav{
  position:sticky;top:0;margin:0;
  z-index:50;
  background:linear-gradient(120deg,rgba(255,255,255,.82),rgba(255,255,255,.55) 45%,rgba(255,255,255,.72));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-bottom:1px solid rgba(255,255,255,.85);border-radius:0;
  padding:8px 36px;display:flex;align-items:center;gap:8px;justify-content:space-between;
  box-shadow:0 6px 24px rgba(31,42,44,.08),inset 0 1px 0 rgba(255,255,255,.95);
  width:100%;
}
.nav.scrolled{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.nav .logo{
  width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.nav .logo svg{width:24px;height:24px;fill:#fff}
.nav .logo img{width:26px;height:26px;object-fit:contain}
.nav .links{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.nav .links a{
  padding:8px 16px;border-radius:999px;font-size:14.5px;font-weight:600;
  transition:.2s;color:var(--ink);
}
.nav .links a:hover{background:var(--cream-dark)}
/* ---------- top actions: WhatsApp + translate ---------- */
.top-actions{
  display:flex;gap:8px;align-items:center;flex:0 0 auto;
}
.top-actions .cta{
  background:var(--deep);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:16px;font-weight:700;white-space:nowrap;transition:.3s;display:inline-block;
  box-shadow:0 6px 20px rgba(15,79,151,.32);
}
.top-actions .cta:hover{background:var(--accent);transform:scale(1.03)}
.lang-btn{
  width:42px;height:42px;border-radius:12px;background:var(--deep);color:#fff;
  border:none;font-weight:800;font-size:15px;cursor:pointer;transition:.3s;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-body);
  box-shadow:0 6px 20px rgba(15,79,151,.32);
}
.lang-btn:hover{background:var(--accent);transform:scale(1.03)}

footer{padding-bottom:110px}
#cases{padding-bottom:120px}
.cases-grid>*:last-child{margin-bottom:80px}

/* ---------- floating contact + chat widget ---------- */
.float-contact{
  position:fixed;right:16px;bottom:16px;z-index:999;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  padding-bottom:env(safe-area-inset-bottom);
  transition:transform .3s ease,opacity .3s ease;
}
.float-contact.fab-hidden{transform:translateY(120px);opacity:0;pointer-events:none}
@media (max-width:480px){.float-contact>a,.chat-fab{width:48px;height:48px;max-width:48px;max-height:48px}}
.float-contact>a,.chat-fab{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 22px rgba(31,42,44,.18);
  transition:.2s;font-size:20px;cursor:pointer;border:none;
}
.float-contact>a:hover,.chat-fab:hover{transform:translateY(-3px)}
.float-contact .mail{background:var(--deep);color:#fff}
.chat-fab{background:var(--deep);position:relative}
.chat-fab .bubble{
  width:26px;height:20px;background:#fff;border-radius:8px;position:relative;
}
.chat-fab .bubble::after{
  content:"";position:absolute;bottom:-6px;left:6px;
  border:7px solid transparent;border-top-color:#fff;border-left-color:#fff;
}
.chat-panel{
  display:none;width:330px;max-width:calc(100vw - 44px);
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  overflow:hidden;box-shadow:0 20px 50px rgba(31,42,44,.25);
}
.chat-panel.open{display:flex;flex-direction:column}
.chat-head{
  background:var(--deep);color:#fff;padding:16px 18px;padding-inline-end:92px;position:relative;flex:none;
}
.chat-lang{
  position:absolute;top:10px;inset-inline-end:52px;
  width:32px;height:32px;border:none;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:700;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.chat-lang:hover{background:rgba(255,255,255,.3)}
.chat-banner{
  background:#fff3e8;color:#8a3c00;font-size:12.5px;font-weight:700;
  padding:8px 14px;text-align:center;border-bottom:1px solid var(--line);flex:none;
}
.chat-close{
  position:absolute;top:10px;inset-inline-end:12px;
  width:32px;height:32px;border:none;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:15px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.chat-close:hover{background:rgba(255,255,255,.3)}
.chat-head b{font-family:var(--font-display);font-size:16px;display:block}
.chat-head span{font-size:12.5px;color:#bcd7f2}
.chat-body{
  padding:14px;min-height:0;overflow-y:auto;flex:1 1 auto;
  display:flex;flex-direction:column;gap:10px;
}
.chat-msg{
  background:var(--cream-dark);border-radius:14px 14px 14px 4px;
  padding:12px 14px;font-size:14.5px;max-width:88%;color:var(--ink);
  line-height:1.55;
}
.chat-msg.user{
  align-self:flex-end;background:var(--deep);color:#fff;
  border-radius:14px 14px 4px 14px;
}
.chat-msg .note{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-soft);font-style:italic}
.chat-msg a.wa{
  display:inline-flex;margin-top:10px;background:#25D366;color:#fff;font-weight:700;
  padding:9px 16px;border-radius:999px;font-size:13.5px;
}
.chat-msg a.wa:hover{background:#1eb857}
.chat-quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;flex:0 1 auto;min-height:0;overflow-y:auto}
.chat-quick:empty{padding:0}
.chat-quick button{
  border:1.5px solid var(--deep);color:var(--deep);background:#fff;
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font-body);transition:.15s;
}
.chat-quick button:hover{background:var(--deep);color:#fff}
.chat-input{display:flex;border-top:1px solid var(--line);flex:none}
.chat-input input{
  flex:1;border:none;background:transparent;padding:15px 16px;font-size:14.5px;
  font-family:var(--font-body);outline:none;color:var(--ink);
}
.chat-input button{
  border:none;background:var(--accent);color:#fff;font-weight:700;
  padding:0 20px;cursor:pointer;font-size:14px;font-family:var(--font-body);
}
.chat-input button:hover{background:var(--deep)}

/* ---------- hero ---------- */
.hero{padding:170px 0 90px;text-align:center;background:linear-gradient(135deg,#0A2A5E 0%,#0E72D2 100%);color:#fff}
.hero .hero-tooth{width:128px;height:128px;fill:var(--accent);margin:0 auto 22px;object-fit:contain}
.hero .kicker{
  display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:999px;
  padding:7px 18px;font-size:13.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.12);margin-bottom:26px;
}
.hero h1{
  font-size:clamp(28px,8vw,36px);font-weight:900;line-height:1.08;
  text-transform:uppercase;
}
.hero h1 .hl{color:#fff}
.hero .role{
  margin:18px auto 8px;font-size:15px;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;color:rgba(255,255,255,.78);
  display:flex;align-items:center;gap:16px;justify-content:center;
}
.hero .role::before,.hero .role::after{
  content:"";height:1px;width:64px;background:rgba(255,255,255,.4);
}
.hero p.lead{max-width:620px;margin:22px auto 36px;font-size:19.5px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.2px}
.hero .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:15px 30px;
  border-radius:999px;font-weight:700;font-size:16px;transition:.3s;
  border:2px solid transparent;cursor:pointer;font-family:inherit;
}
.btn-dark{background:var(--deep);color:#fff}
.btn-dark:hover{background:var(--accent);transform:translateY(-2px) scale(1.03)}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff;transform:translateY(-2px) scale(1.03)}
.hero .btn-dark{background:#fff;color:var(--deep)}
.hero .btn-dark:hover{background:#d9ebff;transform:translateY(-2px) scale(1.03)}
.hero .btn-line{border-color:rgba(255,255,255,.85);color:#fff}
.hero .btn-line:hover{background:rgba(255,255,255,.14);color:#fff;transform:translateY(-2px) scale(1.03)}

/* ---------- marquee ---------- */
.marquee-band{background:var(--accent);transform:rotate(-1.5deg);margin:30px -30px}
.marquee-band.b2{background:var(--deep);transform:rotate(1.2deg)}
.marquee{overflow:hidden;padding:16px 0;white-space:nowrap}
.marquee span{
  display:inline-block;color:#fff;font-family:var(--font-display);
  font-weight:800;font-size:20px;text-transform:uppercase;
  letter-spacing:.06em;padding-right:48px;animation:scroll 22s linear infinite;
}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:340px 1fr;gap:64px;align-items:center}
.portrait{
  aspect-ratio:1/1;border-radius:50%;background:var(--deep);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  border:10px solid var(--card);
  box-shadow:0 18px 40px rgba(15,79,151,.22);
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait img.ph{width:44%;height:44%;object-fit:contain;opacity:.95}
.badge-pill{
  display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:6px 18px;font-size:14px;font-weight:700;margin-bottom:18px;
}
.about-grid #aboutText p{color:var(--ink);font-size:17.5px;line-height:1.75;margin-bottom:16px;max-width:58ch}
.about-grid #aboutText p:first-child{font-weight:600}

/* ---------- skills ---------- */
.skills{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:56px}
.skill{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 26px;text-align:center;min-width:130px;transition:.2s;
}
.skill:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(31,42,44,.1)}
.skill .icon{
  font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--accent);
  margin-bottom:8px;letter-spacing:-.02em;
}
.skill .name{font-weight:700;font-size:14.5px}
.skill .note{font-size:12.5px;color:var(--ink-soft)}
.skill-link{cursor:pointer;position:relative;transition:transform .3s, box-shadow .3s}
.skill-link:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(31,42,44,.16)}

/* ---------- why me ---------- */

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr;gap:20px;margin-top:56px}

  padding:34px 20px;text-align:center;
}

  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px;
}
.stat .n{font-family:var(--font-display);font-weight:800;font-size:44px;color:var(--ink)}

/* ---------- cases ---------- */
.cases-grid{display:grid;grid-template-columns:1fr;gap:20px}

  font-family:var(--font-display);font-weight:800;font-size:22px;text-align:center;
  padding:0 20px;text-transform:uppercase;
}

.case .tag{
  display:inline-block;background:var(--cream-dark);border-radius:999px;

}
.case h3{font-size:20px;margin-bottom:6px}

/* ---------- accessibility polish ---------- */
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- section fade-in on appearance ---------- */
@keyframes fade-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.js-fade .section{opacity:0}
.js-fade .section.fade-in{animation:fade-up .6s ease both}

/* responsive bands: mobile 360-480, tablet 481-768, laptop 769-1280, desktop 1281+ */
@media (min-width:481px){
  .services-grid,.cases-grid,.stats{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:769px){
  .services-grid,.cases-grid,.stats{grid-template-columns:repeat(3,1fr)}
  .nav{height:72px}
}
@media (max-width:768px){
  .nav{height:60px}
  .btn,.nav .links a,.top-actions .cta,.lang-btn{min-height:48px;min-width:48px}
  .hero .btns,.contact-box .btns,.foot-cta .btns{gap:12px}
}
@media (max-width:480px){
  .section{padding:var(--space-xl) 0}
  .btn{width:100%;justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  .js-fade .section{opacity:1}
  .js-fade .section.fade-in{animation:none}
  .intro{animation:curtainUp .35s ease .45s forwards}
  .intro .bg{animation:none}
  .intro .mark{animation:markIn .25s ease 0s both}
  .intro .who{animation:markIn .25s ease .1s both}
  .intro .what{animation:markIn .25s ease .18s both}
  .intro .intro-band{animation:bandUp .3s ease .25s forwards}
  body>*:not(.intro){animation:pageIn .3s ease .7s both}
  .hero .reveal{animation:heroIn .35s ease .85s both}
  .marquee span{animation-duration:60s}
}

[dir="rtl"] .marquee span,[dir="rtl"] .section-title,[dir="rtl"] h3{letter-spacing:0}

function handleChatText(){
  var msg = $("chatText").value.trim();
  if (!msg) return;
  $("chatText").value = "";
  userMsg(msg);
  if (chatStep === "emergency"){
    botSay(pick("Please don't wait here — go to a dental emergency clinic now, or message Dr. Ahmed:","متستناش هنا — روح لطوارئ الأسنان دلوقتي، أو ابعت لد. أحمد:"),
      pick("Hello Dr. Ahmed, this is urgent — I have a dental emergency.","أهلاً د. أحمد، الموضوع طارئ — عندي حالة طوارئ أسنان."));
    return;
  }
  if (chatStep === "done"){
    botSay(pick("Your summary is ready above — tap the WhatsApp button to send it:","ملخصك جاهز فوق — دوس زرار الواتساب عشان تبعته:"), null);
    return;
  }
  if (hasRedFlag(msg)){ emergency(); return; }
  if (chatStep === "choose"){
    var hit = null, low = msg.toLowerCase();
    ISSUES.forEach(function(s){
      if (hit) return;
      s.kw.forEach(function(k){ if (!hit && low.indexOf(k.toLowerCase()) !== -1) hit = s; });
    });
    if (hit){ chooseIssue(hit, false); return; }
    botSay(pick("I'm set up for the issues listed above. For anything else, Dr. Ahmed answers directly:","أنا مجهز للحالات اللي فوق بس. لأي حاجة تانية، د. أحمد بيرد بنفسه:"),
      pick(CONFIG.waPrefill, "أهلاً د. أحمد!"));
    return;
  }
  if (chatStep === "q1"){ chatAns.duration = msg; askQ2(); return; }
  if (chatStep === "q2"){ chatAns.temp = msg; askQ3(); return; }
  if (chatStep === "q3"){
    if (/^(أيوه|ايوه|اه|آه|نعم|yes|yeah)(\s|$|[.!؟،])/i.test(msg)){ emergency(); return; }
    chatAns.swell = msg; afterQuestions(); return;
  }
  if (chatStep === "name"){
    chatName = msg; chatStep = "phone";
    botSay(pick("Thanks, " + chatName + ". Your WhatsApp number?","شكرًا يا " + chatName + ". رقم الواتساب بتاعك؟"));
    return;
  }
  if (chatStep === "phone"){
    var digits = msg.replace(/[^0-9]/g, "");
    if (digits.length < 8){
      botSay(pick("That doesn't look like a full number — type it with the country code, digits only:","الرقم ده مش باين كامل — اكتبه بالكود الدولي، أرقام بس:"));
      return;
    }
    finishChat(digits); return;
  }
}

/* ---- hosted-viewer fix: keep fixed chrome on the visible screen area ----
   The hosting frame is as tall as the page, so plain fixed positioning
   drifts off screen. A full-viewport probe + IntersectionObserver tells us
   which part of the frame is actually visible, and we pin the top actions,
   the floating buttons and the intro band inside that region.
   Standalone (full frame visible) this keeps the original offsets. ---- */
(function(){
  var framed = window.self !== window.top;
  var HEADER_CLEAR = framed ? 74 : 0;  /* the viewer's fixed header bar */
  var probe = document.createElement("div");
  probe.setAttribute("aria-hidden", "true");
  probe.style.cssText = "position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;visibility:hidden;z-index:-1";
  document.body.appendChild(probe);
  function apply(r){
    var ih = window.innerHeight;
    var visT = Math.max(0, r.top), visB = Math.min(ih, r.bottom);
    if (visB - visT < 100) return;
    var floats = $("chatFab") && document.querySelector(".float-contact");
    if (floats){
      floats.style.bottom = Math.max(16, ih - visB + 16) + "px";
      /* keep the whole chat panel (header included) inside the visible area */
      var panel = $("chatPanel");
      if (panel) panel.style.maxHeight = Math.max(240, visB - visT - 170) + "px";
    }
    var band = document.querySelector(".intro .intro-band");
    if (band) band.style.bottom = Math.max(26, ih - visB + 26) + "px";
  }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function(entries){
      var e = entries[0];
      if (e && e.intersectionRect) apply(e.intersectionRect);
    }, {threshold: [0, .1, .25, .5, .75, .9, 1]}).observe(probe);
  }
})();

/* ---- FAB hide on scroll down / show on scroll up ---- */
(function(){
  var fab = document.querySelector(".float-contact");
  if (!fab) return;
  var sc = $("appScroll");
  var getY = function(){ return sc ? sc.scrollTop : window.scrollY; };
  var lastY = getY(), acc = 0;
  var onScroll = function(){
    var y = getY();
    var nearTop = y < 100;
    var nearBottom = sc ? (sc.clientHeight + y) >= (sc.scrollHeight - 10)
                        : (window.innerHeight + y) >= (document.documentElement.scrollHeight - 10);
    var chatOpen = $("chatPanel") && $("chatPanel").classList.contains("open");
    var d = y - lastY;
    lastY = y;
    if (d > 0) acc = acc > 0 ? acc + d : d;
    else if (d < 0) acc = acc < 0 ? acc + d : d;
    if (nearTop || nearBottom || chatOpen){
      acc = 0;
      fab.classList.remove("fab-hidden");
    } else if (acc > 10){
      fab.classList.add("fab-hidden");
    } else if (acc < -10){
      fab.classList.remove("fab-hidden");
    }
  };
  if (sc) sc.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("scroll", onScroll, {passive:true});
})();

/* ============ ADMIN GATE (admin.html only): PIN with SHA-256 hash, first visit creates it ============ */
async function __sha256(t){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
(function(){
  const gate = $("pinGate");
  if (!gate) return;
  let storedHash = null;
  try { storedHash = localStorage.getItem("ownerPinShaV1"); } catch(e) {}
  const setMode = !storedHash;
  $("pgTitle").textContent = pick(setMode ? "Create your editor PIN" : "Editor login", setMode ? "أنشئ رقم سري للتعديل" : "دخول لوحة التعديل");
  $("pgHint").textContent = pick(
    setMode ? "First visit: choose 4 or more digits. Only a scrambled fingerprint (SHA-256) is kept on this device, never the PIN itself. On a new browser or device you will be asked to create it again." : "Enter your PIN to open the editor.",
    setMode ? "أول زيارة: اختار ٤ أرقام أو أكتر. بيتحفظ على الجهاز بصمة مشفّرة بس (SHA-256)، مش الرقم نفسه. على متصفح أو جهاز جديد هيتطلب منك تعمله تاني." : "اكتب الرقم السري عشان تفتح التعديل.");
  $("pgIn1").placeholder = pick(setMode ? "Choose PIN (4+ digits)" : "Your PIN", setMode ? "اختار الرقم (٤ أرقام أو أكتر)" : "الرقم السري");
  $("pgIn2").placeholder = pick("Repeat the PIN","أعد كتابة الرقم");
  $("pgIn2").style.display = setMode ? "" : "none";
  $("pgGo").textContent = pick(setMode ? "Save PIN & open editor" : "Open editor", setMode ? "احفظ الرقم وافتح التعديل" : "افتح التعديل");
  gate.hidden = false;
  setTimeout(function(){ $("pgIn1").focus(); }, 300);
  async function go(){
    const st = $("pgStatus");
    const p1 = $("pgIn1").value.trim();
    if (setMode){
      const p2 = $("pgIn2").value.trim();
      if (p1.length < 4 || !/^\d+$/.test(p1)){ st.textContent = pick("PIN must be 4 or more digits.","الرقم لازم يكون ٤ أرقام أو أكتر."); return; }
      if (p1 !== p2){ st.textContent = pick("The two PINs do not match.","الرقمين مش متطابقين."); return; }
      try { localStorage.setItem("ownerPinShaV1", await __sha256(p1)); } catch(e) {}
      gate.hidden = true;
      if (window.__openCaseEditor) window.__openCaseEditor();
    } else {
      if ((await __sha256(p1)) === storedHash){
        gate.hidden = true;
        if (window.__openCaseEditor) window.__openCaseEditor();
      } else {
        st.textContent = pick("Wrong PIN, try again.","الرقم غلط، حاول تاني.");
      }
    }
  }
  $("pgGo").addEventListener("click", go);
  gate.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
})();

  function compress(file){
    return new Promise(function(resolve){
      const fr = new FileReader();
      fr.onload = function(){
        const img = new Image();
        img.onload = function(){
          try {
            const max = 1200;
            const s = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            resolve(cv.toDataURL("image/jpeg", 0.82));
          } catch(e){ resolve(fr.result); }
        };
        img.onerror = function(){ resolve(fr.result); };
        img.src = fr.result;
      };
      fr.onerror = function(){ resolve(null); };
      fr.readAsDataURL(file);
    });
  }

  function serializeCases(arr){
    return "[\n    " + arr.map(function(c){
      const o = {};
      if (c.id) o.id = c.id;
      o.tag = c.tag; o.title = c.title; o.text = c.text;
      if (c.photos && c.photos.length) o.photos = c.photos;
      return JSON.stringify(o);
    }).join(",\n    ") + "\n  ]";
  }
  function replaceNth(src, key, n, content){
    let idx = -1, from = 0;
    for (let k = 0; k <= n; k++){ idx = src.indexOf(key, from); if (idx < 0) return src; from = idx + key.length; }
    const i = src.indexOf("[", idx);
    let depth = 0, inStr = null, esc = false, j = i;
    for (; j < src.length; j++){
      const ch = src[j];
      if (inStr){ if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === inStr) inStr = null; continue; }
      if (ch === '"' || ch === "'" || ch === '`'){ inStr = ch; continue; }
      if (ch === "[") depth++;
      else if (ch === "]"){ depth--; if (!depth) break; }
    }
    if (depth) return src;
    return src.slice(0, i) + content + src.slice(j + 1);
  }
  function serializeStrArray(arr){
    return "[\n    " + arr.map(s => JSON.stringify(s)).join(",\n    ") + "\n  ]";
  }
  function serializeSocials(arr){
    return "[\n    " + arr.map(s => JSON.stringify({ icon: s.icon, url: s.url })).join(",\n    ") + "\n  ]";
  }
  function buildExport(){
    /* standalone file: the full source is in the page, export a complete updated HTML.
       hosted viewer: no inline source, export just the owner's data to send to Instinct. */
    if (SOURCE_SNAPSHOT.indexOf("cases:") > -1) {
      let src = SOURCE_SNAPSHOT;
      src = src.replace(/<!-- ADMIN-START -->[\s\S]*?<!-- ADMIN-END -->/g, "");
      src = src.replace(/\/\* ADMIN-START \*\/[\s\S]*?\/\* ADMIN-END \*\//g, "");
      src = replaceNth(src, "cases:", 0, serializeCases(CONFIG.cases));
      src = replaceNth(src, "cases:", 1, serializeCases(AR.cases));
      src = replaceNth(src, "aboutText:", 0, serializeStrArray(CONFIG.aboutText));
      src = replaceNth(src, "aboutText:", 1, serializeStrArray(AR.aboutText));
      src = replaceNth(src, "socials:", 0, serializeSocials(CONFIG.socials));
      if (profilePhoto) src = src.replace(/(<div class="portrait"><img class="ph" src=")[^"]*(")/, "$1" + profilePhoto + "$2");
      return { kind: "html", text: src };
    }
    return { kind: "pack", text: JSON.stringify({
      type: "dental-portfolio-cases",
      cases: stored,
      bio: { en: CONFIG.aboutText, ar: AR.aboutText },
      socials: CONFIG.socials,
      profilePhoto: profilePhoto
    }, null, 2) };
  }

          "التنزيل بدأ. ابعت الملف الجديد لإنستينكت على واتساب عشان يتنشر. لو مفيش حاجة نزلت، استخدم نسخ والصق الكود.")
      : P("Download is blocked here. Use Copy and paste the code to Instinct on WhatsApp.",
          "التنزيل مقفول هنا. استخدم نسخ والصق الكود لإنستينكت على واتساب.");
  }
  function copyCode(){
    const ta = panel.querySelector("#epCode");
    const st = panel.querySelector("#epStatus");
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e) {}
    if (!ok && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){
        st.textContent = P("Copied. Paste it to Instinct on WhatsApp.","اتنسخ. الصقه لإنستينكت على واتساب.");
      }, function(){
        st.textContent = P("Select the code above and copy it manually.","حدد الكود فوق واعمله نسخ يدوي.");
      });
      return;
    }
    st.textContent = ok ? P("Copied. Paste it to Instinct on WhatsApp.","اتنسخ. الصقه لإنستينكت على واتساب.")
                        : P("Select the code above and copy it manually.","حدد الكود فوق واعمله نسخ يدوي.");
  }
  function toggleEditor(){
    if (!panel) buildPanel();
    panel.style.display = panel.style.display === "none" ? "block" : "none";
    if (panel.style.display === "block"){
      panel.querySelector("#fBioEn").value = (CONFIG.aboutText || []).join("\n\n");
      panel.querySelector("#fBioAr").value = (AR.aboutText || []).join("\n\n");
      soc = freshSoc();
      renderSocRows();
    }
  }
  applyProfilePhoto();
  if (stored.length || startDirty) renderAll();
  const _renderAll = renderAll;
  renderAll = function(){ _renderAll(); renderEditorLabels(); };
  window.__openCaseEditor = function(){ toggleEditor(); };
})();

    if (!el.dataset.mounted) { el.dataset.mounted = "1"; window.CUSDIS.renderTo(el); }
  });
};
window.__initCusdis();
});
