 {id:'demo-extraction',tab:'patients',category:'aftercare',titleEn:'After extraction: 5 things to avoid',titleAr:'بعد الخلع: 5 أشياء ممنوعة لو عايز الجرح يلم بسرعة',excerptEn:'Protect the blood clot and give your mouth time to heal.',excerptAr:'حافظ على الجلطة الدموية وادي مكان الخلع فرصة يلتئم.',bodyEn:'## Protect the healing socket\n- Do not rinse or spit for the first 24 hours.\n- Do not touch the socket with your tongue or fingers.\n- Avoid hot food and drinks while your mouth is numb. Choose soft foods.\n- Do not smoke for at least 48 hours.\n- Avoid strenuous exercise for 24 hours.\n\nFollow your treating dentist\'s instructions, which may differ for your procedure. After 24 hours, clean carefully and use gentle warm salt-water rinses if advised.\n\n## When to get help\nContact your dentist for persistent bleeding, severe or worsening pain, or concerning swelling. Heavy bleeding that will not stop, or difficulty breathing or swallowing, needs emergency care. Do not wait for a WhatsApp reply.',bodyAr:'## حافظ على مكان الخلع\n- بلاش مضمضة أو بصق أول 24 ساعة.\n- بلاش تلمس الجرح بلسانك أو بصوابعك.\n- بلاش أكل أو شرب سخن طول ما البنج شغال، واختار أكل طري.\n- بلاش تدخين لمدة 48 ساعة على الأقل.\n- بلاش مجهود عنيف أول 24 ساعة.\n\nاتبع تعليمات الطبيب اللي عالجك، لأنها ممكن تختلف حسب حالتك. بعد أول 24 ساعة، نظف بحرص واعمل مضمضة هادية بماء دافئ وملح لو الطبيب نصحك بكده.\n\n## إمتى تطلب مساعدة؟\nراجع طبيبك لو النزيف مستمر، أو الألم شديد أو بيزيد، أو فيه تورم مقلق. النزيف الغزير اللي مش بيقف أو صعوبة التنفس أو البلع محتاجين طوارئ فورًا. متستناش رد واتساب.',source:'https://www.uclh.nhs.uk/patients-and-visitors/patient-information-pages/dental-extractions-post-operative-instructions',attribution:'Educational summary based on UCLH NHS guidance',educational:true},
 {id:'demo-gums',tab:'patients',category:'myths',titleEn:'Bleeding when you brush? Do not ignore your gums',titleAr:'لثتك بتنزف وانت بتغسل؟ ده السبب الحقيقي',excerptEn:'Bleeding can be a sign of gum disease. A dental check matters.',excerptAr:'نزيف اللثة ممكن يكون علامة التهاب، والكشف مهم لمعرفة السبب.',bodyEn:'## Bleeding is a sign to get checked\nPlaque can build up around teeth and irritate the gums. Bleeding when brushing or cleaning between teeth can be a sign of gum disease. It is not possible to diagnose the cause from bleeding alone.\n\n## Keep cleaning gently\n- Brush with fluoride toothpaste twice a day. Spit after brushing without rinsing.\n- Clean between teeth daily with floss or interdental brushes.\n- Arrange a dental check if your gums bleed, hurt or swell.\n\nVery sore or swollen gums, loose teeth, ulcers or a lump need urgent dental assessment. Do not replace a dental check with an online diagnosis.',bodyAr:'## النزيف علامة محتاجة كشف\nتراكم البلاك حوالين الأسنان ممكن يهيج اللثة. النزيف مع التفريش أو التنظيف بين الأسنان ممكن يكون علامة التهاب لثة، لكن النزيف لوحده مش كفاية لتشخيص السبب.\n\n## كمل التنظيف برفق\n- اغسل بمعجون فيه فلورايد مرتين في اليوم. ابصق المعجون من غير مضمضة بعده مباشرة.\n- نظف بين الأسنان يوميًا بخيط أو فرش بينية مناسبة.\n- احجز كشف لو اللثة بتنزف أو بتوجعك أو متورمة.\n\nألم أو تورم شديد، أسنان بتتحرك، قرح أو كتلة محتاجين تقييم عاجل من طبيب أسنان. التشخيص على النت مش بديل للكشف.',source:'https://www.nhs.uk/conditions/gum-disease/',attribution:'Educational summary based on NHS guidance',educational:true},
 {id:'demo-broken',tab:'patients',category:'emergency',titleEn:'Broken tooth after an accident: the first steps',titleAr:'سنك اتكسر في حادثة؟ اعمل كده في أول ساعة',excerptEn:'Keep the fragment safe and contact a dentist for assessment.',excerptAr:'احتفظ بالجزء المكسور واتواصل مع طبيب أسنان لتقييم الإصابة.',bodyEn:'## Keep the broken piece\nIf you find a piece of tooth, put it in milk or in a clean container with your own saliva and take it to a dentist. The dentist may be able to reattach it. Do not try household glue.\n\n## Get dental advice\nContact a dentist after a chip, crack or break. Pain, the size of the break and any other injuries affect how urgently you need care. If the whole tooth has come out, get emergency dental help immediately, this is different from a small chip.\n\n## Go to emergency care now\nSerious face or jaw injury, heavy bleeding that will not stop, breathing difficulty, or loss of consciousness after a head injury need emergency care. Do not wait for WhatsApp.',bodyAr:'## احتفظ بالجزء المكسور\nلو لقيت جزء من السن، حطه في لبن أو في علبة نظيفة فيها من لعابك وخده لطبيب الأسنان. ممكن الطبيب يقدر يرجعه مكانه. متستخدمش أي لزق منزلي.\n\n## اطلب تقييم من طبيب أسنان\nأي شرخ أو كسر محتاج كشف. درجة الألم وحجم الكسر وأي إصابات تانية بتحدد مدى الاستعجال. لو السن كله خرج من مكانه، اطلب طوارئ أسنان فورًا، ودي حالة مختلفة عن كسر جزء صغير.\n\n## روح الطوارئ فورًا\nإصابة شديدة بالوجه أو الفك، نزيف غزير مش بيقف، صعوبة التنفس أو فقدان الوعي بعد إصابة بالرأس محتاجين طوارئ. متستناش رد واتساب.',source:'https://www.nhs.uk/conditions/chipped-broken-or-cracked-tooth/',attribution:'Educational summary based on NHS guidance',educational:true}

 function relatedArticles(a,box){const section=node('section',undefined,'ml-related');section.append(node('h2',tr('Related articles','مقالات مشابهة')));const grid=node('div',undefined,'ml-grid ml-related-grid');const related=articles.filter(x=>x.id!==a.id&&x.tab===a.tab).sort((x,y)=>Number(y.category===a.category)-Number(x.category===a.category)).slice(0,3);related.forEach(x=>{const card=node('article',undefined,'ml-card');card.append(artImage(x));const content=node('div',undefined,'ml-card-content');content.append(node('div',label(x.category),'ml-label'),node('h3',field(x,'title')));const b=node('button',tr('Read article →','اقرأ المقالة ←'),'ml-read');b.type='button';b.onclick=()=>showArticle(x);content.append(b);card.append(content);grid.append(card);});for(let i=related.length;i<3;i++){const card=node('article',undefined,'ml-card ml-placeholder ml-related-placeholder');card.append(node('div','+','ml-illustration'),node('h3',tr('More articles, coming soon','مقالات جديدة.. قريبًا')));grid.append(card);}section.append(grid);box.append(section);}
 function showArticle(a){
